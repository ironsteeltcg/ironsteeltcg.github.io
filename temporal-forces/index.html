.sheet-wrap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;visibility:hidden}

.pack{position:relative;width:200px;margin:6px auto 14px;aspect-ratio:5/8;border-radius:16px;overflow:hidden;

 el.style.setProperty('--mx',(x*100)+'%');el.style.setProperty('--my',(y*100)+'%');el.style.setProperty('--go',1)}
function untilt(el){const cd=el.querySelector('.card');cd.style.removeProperty('--rx');cd.style.removeProperty('--ry');el.style.setProperty('--go',0)}
if(!RM&&FINE){let raf=0,cur=null;g.addEventListener('pointermove',e=>{const s=e.target.closest('.slot.own');if(cur&&cur!==s)untilt(cur);cur=s;if(!s)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>tilt(s,e))});
 g.addEventListener('pointerleave',()=>{if(cur)untilt(cur);cur=null})}
/* ---- sound + haptics ---- */
let AC=null,sound=localStorage.getItem(SK)!=='0';
function snd(kind,p=1){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime;
 if(kind=='chime'){[880,1318.5,1760].forEach((fq,i)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.value=fq;gn.gain.setValueAtTime(0,t+i*.07);gn.gain.linearRampToValueAtTime(.12,t+i*.07+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+i*.07+.5);o.connect(gn).connect(AC.destination);o.start(t+i*.07);o.stop(t+i*.07+.55)});return}
 const dur=kind=='rip'?.32:.035,len=Math.ceil(AC.sampleRate*dur),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,kind=='rip'?1.5:3);
 const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=b;bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(kind=='rip'?1800:1200+p*2600,t);if(kind=='rip')bp.frequency.exponentialRampToValueAtTime(5200,t+dur);
 gn.gain.value=kind=='rip'?.5:.18;s.connect(bp).connect(gn).connect(AC.destination);s.start()}catch(_){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
function setSnd(){$('snd').setAttribute('aria-pressed',sound);$('sw').style.display=sound?'':'none';$('snd').title=sound?'Sound on':'Sound off'}
$('snd').onclick=()=>{sound=!sound;localStorage.setItem(SK,sound?'1':'0');setSnd();if(sound)snd('chime')};setSnd();
/* ---- confetti / particle burst (canvas, self-written) ---- */
let fx=null,P=[],fxRaf=0;
function burst(x,y,power=1){if(RM)return;if(!fx){fx=document.createElement('canvas');fx.id='fx';document.body.appendChild(fx)}
 const dpr=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;const ctx=fx.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 const cols=['#ffd166','#ffe08a','#ff5d8f','#47d7ff','#8b5cf6','#3ddc97','#ffffff'],n=Math.round(46*power);
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*7)*(.8+power*.25);
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.22+Math.random()*.1,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,w:5+Math.random()*6,h:3+Math.random()*4,c:cols[i%cols.length],sh:i%5==0?'star':i%3==0?'dot':'rect',life:0,max:70+Math.random()*50,tw:Math.random()*6.28})}
 if(!fxRaf)fxRaf=requestAnimationFrame(function step(){ctx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.life<p.max);for(const p of P){p.life++;p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx+Math.sin(p.tw+p.life*.15)*.6;p.y+=p.vy;p.r+=p.vr;
   const al=Math.min(1,(p.max-p.life)/25);ctx.save();ctx.globalAlpha=al;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
   if(p.sh=='rect'){ctx.scale(1,Math.cos(p.life*.2+p.tw));ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}else if(p.sh=='dot'){ctx.beginPath();ctx.arc(0,0,p.h*.6,0,6.28);ctx.fill()}
   else{ctx.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.w*.35:p.w*.9,aa=k*Math.PI/5;ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}ctx.closePath();ctx.shadowColor=p.c;ctx.shadowBlur=8;ctx.fill()}ctx.restore()}
  if(P.length)fxRaf=requestAnimationFrame(step);else{fxRaf=0;ctx.clearRect(0,0,innerWidth,innerHeight)}})}
function burstAt(el,power){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,power)}
/* ---- sheet ---- */
function openSheet(html,label){lastFocus=document.activeElement;$('mb').innerHTML=html;$('sheet').setAttribute('aria-label',label||'Details');$('sheet').style.removeProperty('--dy');
 const w=$('sw-wrap');w.classList.add('open');w.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';wireImgs($('mb'));setTimeout(()=>$('sheet').focus({preventScroll:true}),30)}
function closeSheet(){const w=$('sw-wrap');w.classList.remove('open');w.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
$('cx').onclick=closeSheet;$('scrim').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});
(function dragDismiss(){const h=$('handle'),s=$('sheet');let y0=null;h.addEventListener('pointerdown',e=>{y0=e.clientY;h.setPointerCapture(e.pointerId);s.style.transition='none'});
 h.addEventListener('pointermove',e=>{if(y0==null)return;s.style.setProperty('--dy',Math.max(0,e.clientY-y0)+'px')});
 const up=e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;s.style.transition='';if(dy>90)closeSheet();else s.style.setProperty('--dy','0px')};h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})();
function rarityLabel(c){return c.r||'Card'}
function ebaySearch(c){return 'https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(c.name+' '+pad(c)+' '+CFG.q+' pokemon')}
function buyLinks(c){return c.buy.map(x=>{const tp=x.pf=='tcgplayer';return `<a class="btn ${tp?'btn--tcg':'btn--shop'}" target="_blank" rel="noopener" href="${esc(x.u)}"><span class="ico">${tp?'TP':'eB'}</span><span class="txt">Get it from Iron &amp; Steel on ${tp?'TCGPlayer':'eBay'}<span class="sub">${esc(x.t)}</span></span><span aria-hidden="true">↗</span></a>`}).join('')}
function shopHTML(c){if(c.buy.length)return `<div class="sect">In stock with us</div><div class="stack">${buyLinks(c)}</div>`;
 return `<div class="sect">We don't have this one yet</div><div class="stack">`+(c.aff?`<a class="btn btn--tcg" target="_blank" rel="noopener sponsored" href="${esc(c.aff)}"><span class="ico">TP</span><span class="txt">Find it on TCGplayer</span><span>↗</span></a><p class="note">Affiliate link: we may earn a small commission.</p>`:'')+
 `<a class="btn btn--ghost" target="_blank" rel="noopener" href="${esc(ebaySearch(c))}"><span class="ico">eB</span><span class="txt">Search eBay</span><span>↗</span></a></div>`}
function bigCard(c,extra=''){const o=own.has(c.k),t=tier(c.r);return `<div class="big"><div class="slot ${o?'own':''} r${t}" data-k="${esc(c.k)}" id="bigslot"><div class="card sk"><img src="${esc(c.big||c.img)}" alt="${esc(c.name)}" decoding="async"><div class="foil"></div><div class="glare"></div></div></div></div>`}
function wireBigTilt(){const s=$('bigslot');if(!s||RM)return;s.addEventListener('pointermove',e=>tilt(s,e,18));s.addEventListener('pointerleave',()=>untilt(s))}
function openCard(c,fromEl){const o=own.has(c.k);
 openSheet(`<div class="dgrid">${bigCard(c)}<div class="dinfo"><div class="eyebrow">${esc(CFG.set)} · #${esc(pad(c))}${c.m?' / '+CFG.main:''}</div><h2>${esc(c.name)}</h2>
 <div class="meta"><span class="chip">${esc(rarityLabel(c))}</span>${c.p?`<span class="chip">Market about <b>$${c.p.toFixed(2)}</b></span>`:''}${c.rh?`<span class="chip">Reverse holo about <b>$${c.rh.toFixed(2)}</b></span>`:''}<span class="chip status ${o?'own':'miss'}">${o?'✓ In your binder':'Missing'}</span></div>
 ${o?'<button class="btn btn--ghost" id="tg">Remove from my binder</button>':tearHTML('I have it · tear to add')}
 ${o?'':shopHTML(c)}</div></div>`,c.name);
 wireBigTilt();
 if(o)$('tg').onclick=()=>{own.delete(c.k);save();closeSheet();render();toast('Removed from your binder')};else wireTear(()=>rip(c))}
/* ---- tear strip ---- */
function tearHTML(lbl){return `<div class="tear" id="tear"><div class="slit"></div><div class="lbl">${esc(lbl)} →</div><div class="knob" id="kn" tabindex="0" role="slider" aria-label="Drag right to tear and add this card" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">⟫</div></div>`}
function wireTear(onDone){const r=$('tear'),k=$('kn');if(!r)return;let d=false,x0=0,done=false,last=0,step=0;
 const max=()=>r.clientWidth-k.offsetWidth-8;
 const set=m=>{const p=Math.max(0,Math.min(1,m/max()));k.style.setProperty('--kx',m+'px');r.style.setProperty('--p',p.toFixed(3));k.setAttribute('aria-valuenow',Math.round(p*100));
  const st=Math.floor(p*10);if(st>step){step=st;snd('tick',p);if(st%2==0)buzz(6)}else if(st<step)step=st};
 const finish=()=>{if(done)return;done=true;d=false;set(max());r.classList.add('done');snd('rip');buzz([18,40,30]);setTimeout(onDone,RM?0:180)};
 k.addEventListener('pointerdown',e=>{if(done)return;d=true;x0=e.clientX-(parseFloat(k.style.getPropertyValue('--kx'))||0);k.style.transition='none';try{k.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault()});
 k.addEventListener('pointermove',e=>{if(!d)return;const m=Math.max(0,Math.min(max(),e.clientX-x0));set(m);if(m>=max()-3)finish()});
 const up=()=>{if(!d)return;d=false;const m=parseFloat(k.style.getPropertyValue('--kx'))||0;if(m>=max()*.85)finish();else{k.style.transition='transform .3s var(--ease-spring)';r.style.transition='--p .3s';set(0);step=0}};
 k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);
 k.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '||e.key=='ArrowRight'||e.key=='End'){e.preventDefault();finish()}})}
function rip(c){own.add(c.k);save();closeSheet();const t=tier(c.r);
 const go=()=>{render();const el=g.querySelector(`.slot[data-k="${CSS.escape(c.k)}"]`);if(el){el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});el.classList.add('pop');
  setTimeout(()=>{burstAt(el,t);snd('chime')},RM?0:260);setTimeout(()=>el.classList.remove('pop'),1000)}else{burst(innerWidth/2,innerHeight/2,t);snd('chime')}
  toast(`${c.name} added · ${counts().om}/${CFG.main}`)};
 if(f=='miss'){f='all';document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.f=='all'));movePill()}go()}
let tt=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
/* ---- free daily rip ---- */
function untilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.round((m-n)/60000);return `${Math.floor(s/60)}h ${s%60}m`}
$('daily').onclick=()=>{const day=today();
 if(localStorage.getItem(DK)==day){openSheet(`<div style="text-align:center"><div class="eyebrow">Free daily rip</div><h2 style="margin:8px 0">You already ripped today's pack</h2><p style="color:var(--ink-200)">Next free pack in <b>${untilMidnight()}</b>.</p></div>`,'Daily rip');return}
 const pool=C.filter(c=>c.buy.length);if(!pool.length){openSheet(`<div style="text-align:center"><h2>No cards from this set in stock right now</h2></div>`,'Daily rip');return}
 const c=pool[Math.floor(Math.random()*pool.length)];
 openSheet(`<div style="text-align:center"><div class="eyebrow">Today's free rip</div><h2 style="margin:6px 0 4px">One free pack a day</h2><p style="color:var(--ink-200);margin:0 0 6px;font-size:14px">Reveals a random card we actually have in stock.</p>
  <div class="pack" id="pack"><div class="crimp t"></div><div class="pl"><div>${CFG.logo?`<img src="${esc(CFG.logo)}" alt="">`:''}${esc(CFG.set)}<div style="font-size:11px;opacity:.85;margin-top:6px">IRON &amp; STEEL DAILY</div></div></div><div class="crimp b"></div></div>${tearHTML('Tear the pack open')}</div>`,'Daily rip');
 wireTear(()=>{localStorage.setItem(DK,day);$('pack').classList.add('torn');const t=tier(c.r);
  setTimeout(()=>{$('mb').innerHTML=`<div style="text-align:center"><div class="eyebrow">Today's free rip</div><div class="reveal pop-wrap">${bigCard(c)}</div><h2 style="margin:4px 0">${esc(c.name)} <span style="color:var(--ink-400)">#${esc(pad(c))}</span></h2>
   <div class="meta" style="justify-content:center"><span class="chip">${esc(rarityLabel(c))}</span><span class="chip">Lightly Played</span></div></div><div class="stack">${buyLinks(c)}</div>`;$('mb').dataset.rip=c.k;wireImgs($('mb'));wireBigTilt();
   const bs=$('bigslot');bs.classList.add('own','pop');burstAt(bs,t+1);snd('chime')},RM?0:450)})};
/* ---- share PNG ---- */
function shareCanvas(){const W=1080,cv=document.createElement('canvas');cv.width=W;cv.height=W;const x=cv.getContext('2d');
 const bg=x.createRadialGradient(540,0,50,540,200,900);bg.addColorStop(0,'#2a1d4d');bg.addColorStop(1,'#0c0a14');x.fillStyle=bg;x.fillRect(0,0,W,W);
 const {o,om}=counts(),pct=CFG.main?om/CFG.main:0,gr=x.createLinearGradient(240,0,840,0);gr.addColorStop(0,'#ffd166');gr.addColorStop(.5,'#ff5d8f');gr.addColorStop(1,'#47d7ff');
 x.textAlign='center';x.fillStyle='#ffd166';x.font='800 34px system-ui';x.fillText('MY DIGITAL BINDER',540,120);
 x.fillStyle='#fff';let fs=72;x.font=`800 ${fs}px system-ui`;while(x.measureText(CFG.set).width>940&&fs>34){fs-=4;x.font=`800 ${fs}px system-ui`}x.fillText(CFG.set,540,205);
 x.lineWidth=46;x.lineCap='round';x.strokeStyle='#2a2540';x.beginPath();x.arc(540,530,220,0,Math.PI*2);x.stroke();
 if(pct>0){x.strokeStyle=gr;x.beginPath();x.arc(540,530,220,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);x.stroke()}
 x.fillStyle='#fff';x.font='800 150px system-ui';x.fillText(Math.floor(pct*100)+'%',540,570);x.fillStyle='#b9b3d1';x.font='600 36px system-ui';x.fillText('main set',540,625);
 x.fillStyle='#f5f3ff';x.font='600 44px system-ui';x.fillText(`${om}/${CFG.main} main set · ${o}/${C.length} total`,540,850);
 x.fillStyle='#b9b3d1';x.font='500 34px system-ui';x.fillText('Track yours free · Iron & Steel',540,960);return cv}
$('share').onclick=()=>{const cv=shareCanvas(),name=`my-${CFG.slug}-binder.png`;
 cv.toBlob(async b=>{const file=new File([b],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`My ${CFG.set} binder`});return}catch(e){if(e.name=='AbortError')return}}
  const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(b);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Progress image saved')},'image/png')};
window.__binder={shareCanvas,counts,today,C,CFG};
render();requestAnimationFrame(movePill);
</script></body></html>
